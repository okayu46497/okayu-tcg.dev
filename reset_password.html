<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード再設定</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #0a0e1a;
      --bg-card: rgba(255, 255, 255, 0.04);
      --bg-card-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8eaed;
      --text-dim: #9aa0a6;
      --accent: #6c63ff;
      --accent-glow: rgba(108, 99, 255, 0.4);
      --water: #4488ff;
      --success: #34d399;
      --danger: #f87171;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg-primary);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(108, 99, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(68, 136, 255, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(255, 68, 68, 0.05) 0%, transparent 50%);
      animation: bgFloat 20s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes bgFloat {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg);
      }
      33% {
        transform: translate(2%, -1%) rotate(1deg);
      }
      66% {
        transform: translate(-1%, 2%) rotate(-1deg);
      }
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: border-color 0.3s;
    }

    .card:hover {
      border-color: rgba(108, 99, 255, 0.3);
    }

    .title {
      font-size: 24px;
      font-weight: 900;
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 30%, var(--text-dim));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-dim);
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      padding-right: 44px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .eye-btn:hover {
      color: var(--text);
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--water));
      border: none;
      border-radius: 12px;
      padding: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(108, 99, 255, 0.2);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(108, 99, 255, 0.4);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
      line-height: 1.5;
    }

    .alert-error {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.2);
      color: var(--danger);
      display: block;
    }

    .alert-success {
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.2);
      color: var(--success);
      display: block;
    }

    .link-lobby {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: color 0.2s;
    }

    .link-lobby:hover {
      color: #fff;
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1 class="title">パスワード再設定</h1>
      <p class="subtitle">新しく使用する安全なパスワードを入力してください</p>

      <div id="alert-box" class="alert"></div>

      <form id="reset-form">
        <div class="form-group">
          <label for="new-password">新しいパスワード (4〜20文字)</label>
          <div class="input-wrapper">
            <input type="password" id="new-password" required minlength="4" maxlength="20">
            <button type="button" class="eye-btn" onclick="togglePasswordVisibility('new-password')">👁️</button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password">新しいパスワード (確認用)</label>
          <div class="input-wrapper">
            <input type="password" id="confirm-password" required minlength="4" maxlength="20">
            <button type="button" class="eye-btn" onclick="togglePasswordVisibility('confirm-password')">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn" id="submit-btn">パスワードを更新する</button>
      </form>

      <a href="/" class="link-lobby">ログイン画面に戻る</a>
    </div>
  </div>

  <script>
    // URLからトークンを取得
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const alertBox = document.getElementById('alert-box');
    const resetForm = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');

    // トークンチェック
    if (!token) {
      showAlert('エラー: 無効なアクセスです。パスワード再設定用のメールからアクセスしてください。', 'error');
      resetForm.style.display = 'none';
    }

    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = 'alert';
      if (type === 'error') {
        alertBox.classList.add('alert-error');
      } else if (type === 'success') {
        alertBox.classList.add('alert-success');
      }
      alertBox.style.display = 'block';
    }

    function togglePasswordVisibility(id) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = document.getElementById('new-password').value.trim();
      const confirmPassword = document.getElementById('confirm-password').value.trim();

      if (newPassword !== confirmPassword) {
        showAlert('パスワードと確認用パスワードが一致しません。', 'error');
        return;
      }

      // バリデーション (英数字および演算記号、@ ! # $ & < > 等)
      const allowedRegex = /^[a-zA-Z0-9+\-*/=%@!"#$&'<>{}\[\]~]+$/;
      if (!allowedRegex.test(newPassword)) {
        showAlert('パスワードに使用できない特殊文字が含まれています。', 'error');
        return;
      }

      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = '更新中...';

      try {
        const response = await fetch('/api/reset_password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            token: token,
            password: newPassword
          })
        });

        const data = await response.json();
        if (response.ok && data.success) {
          showAlert('パスワードの再設定が完了しました！3秒後にログイン画面に戻ります。', 'success');
          resetForm.style.display = 'none';
          setTimeout(() => {
            window.location.href = '/';
          }, 3000);
        } else {
          showAlert(data.detail || 'パスワードの再設定に失敗しました。トークンの期限が切れている可能性があります。', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'パスワードを更新する';
        }
      } catch (err) {
        showAlert('通信エラーが発生しました。インターネット接続を確認してください。', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'パスワードを更新する';
      }
    });
  </script>
</body>

</html>
