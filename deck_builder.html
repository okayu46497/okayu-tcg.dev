<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCG - デッキ作成</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080c14;
      --bg-card: rgba(255, 255, 255, 0.04);
      --bg-card-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8eaed;
      --text-dim: #9aa0a6;
      --accent: #6c63ff;
      --accent-glow: rgba(108, 99, 255, 0.4);
      --success: #34d399;
      --danger: #f87171;
      --warn: #fbbf24;
      --civ-fire: #ef4444;
      --civ-water: #3b82f6;
      --civ-light: #facc15;
      --civ-darkness: #a855f7;
      --civ-nature: #22c55e;
      --civ-zero: #9ca3af;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 50%, rgba(108, 99, 255, 0.06) 0%, transparent 50%), radial-gradient(ellipse at 70% 30%, rgba(52, 211, 153, 0.05) 0%, transparent 50%);
      z-index: -1;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all 0.2s;
    }

    .header a:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    .page-content {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 65px);
    }

    /* ===== Top: Saved decks ===== */
    .saved-section {
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.15);
    }

    .saved-header {
      padding: 12px 20px 8px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .saved-scroll {
      display: flex;
      gap: 12px;
      padding: 8px 20px 14px;
      overflow-x: auto;
      min-height: 88px;
      align-items: stretch;
    }

    .saved-scroll::-webkit-scrollbar {
      height: 4px;
    }

    .saved-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    .saved-deck-card {
      flex-shrink: 0;
      width: 130px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg-card);
    }

    .saved-deck-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .saved-deck-card img {
      width: 100%;
      height: 52px;
      object-fit: cover;
      display: block;
    }

    .saved-deck-card .noimg {
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: rgba(0, 0, 0, 0.3);
    }

    .saved-deck-info {
      padding: 4px 8px 6px;
    }

    .saved-deck-name {
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .saved-deck-meta {
      font-size: 9px;
      color: var(--text-dim);
    }

    .saved-deck-card.own {
      border-color: rgba(108, 99, 255, 0.3);
    }

    .saved-deck-card.own:hover {
      border-color: var(--accent);
    }

    .saved-deck-card.other {
      border-color: rgba(255, 255, 255, 0.06);
    }

    .saved-deck-card.other:hover {
      border-color: var(--success);
    }

    .empty-decks {
      color: var(--text-dim);
      font-size: 12px;
      padding: 12px 0;
    }

    /* ===== Builder area ===== */
    .builder {
      display: grid;
      grid-template-columns: 1fr 380px;
      flex: 1;
      overflow: hidden;
    }

    @media (max-width: 900px) {
      .builder {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }

    .pool-panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .pool-header {
      padding: 14px 20px 10px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--border);
    }

    .pool-header h2 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 9px 14px 9px 36px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-box input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      pointer-events: none;
    }

    .pool-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 20px;
    }

    .pool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
    }

    .pool-card {
      border-radius: 8px;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 9px;
      position: relative;
    }

    .pool-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      border-color: var(--accent);
    }

    .pool-card:active {
      transform: translateY(-1px) scale(0.97);
    }

    .pool-card.civ-fire {
      background: linear-gradient(180deg, #1a0505, #2d0a0a);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .pool-card.civ-water {
      background: linear-gradient(180deg, #050a1a, #0a152d);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .pool-card.civ-light {
      background: linear-gradient(180deg, #1a1805, #2d2a0a);
      border-color: rgba(250, 204, 21, 0.3);
    }

    .pool-card.civ-darkness {
      background: linear-gradient(180deg, #10051a, #1a0a2d);
      border-color: rgba(168, 85, 247, 0.3);
    }

    .pool-card.civ-nature {
      background: linear-gradient(180deg, #051a0a, #0a2d12);
      border-color: rgba(34, 197, 94, 0.3);
    }

    .pool-card.civ-zero {
      background: linear-gradient(180deg, #141414, #1f1f1f);
      border-color: rgba(156, 163, 175, 0.3);
    }

    .pool-card-img {
      width: 100%;
      height: 70px;
      object-fit: cover;
      display: block;
    }

    .pool-card-noimg {
      width: 100%;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: rgba(0, 0, 0, 0.3);
    }

    .pool-card-body {
      padding: 5px 7px;
    }

    .pool-card-name {
      font-weight: 700;
      font-size: 9px;
      line-height: 1.3;
      margin-bottom: 3px;
    }

    .civ-fire .pool-card-name {
      color: #fca5a5;
    }

    .civ-water .pool-card-name {
      color: #93c5fd;
    }

    .civ-light .pool-card-name {
      color: #fde68a;
    }

    .civ-darkness .pool-card-name {
      color: #d8b4fe;
    }

    .civ-nature .pool-card-name {
      color: #86efac;
    }

    .civ-zero .pool-card-name {
      color: #d1d5db;
    }

    .pool-card-stats {
      display: flex;
      justify-content: space-between;
      font-size: 8px;
      color: var(--text-dim);
    }

    .pool-card-stats .cost {
      background: rgba(0, 0, 0, 0.4);
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 900;
    }

    .pool-card-stats .power {
      color: var(--warn);
      font-weight: 900;
    }

    .pool-card::after {
      content: '+';
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .pool-card:hover::after {
      opacity: 1;
    }

    .empty-msg {
      color: var(--text-dim);
      text-align: center;
      padding: 30px;
      font-size: 13px;
    }

    /* Right panel */
    .deck-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.15);
    }

    .deck-header {
      padding: 14px 20px 10px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--border);
    }

    .deck-header h2 {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .deck-name-row {
      display: flex;
      gap: 8px;
    }

    .deck-name-row input {
      flex: 1;
      padding: 9px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .deck-name-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .deck-name-row input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .deck-count-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid var(--border);
    }

    .deck-count {
      font-size: 13px;
      font-weight: 900;
    }

    .deck-count.valid {
      color: var(--success);
    }

    .deck-count.invalid {
      color: var(--danger);
    }

    .deck-count-hint {
      font-size: 10px;
      color: var(--text-dim);
    }

    .deck-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px 20px;
    }

    .deck-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 7px;
      margin-bottom: 3px;
      transition: all 0.15s;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
    }

    .deck-entry:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border);
    }

    .deck-entry-img {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .deck-entry-noimg {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }

    .deck-entry-info {
      flex: 1;
      min-width: 0;
    }

    .deck-entry-name {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .deck-entry-meta {
      font-size: 9px;
      color: var(--text-dim);
    }

    .deck-entry-qty {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .qty-btn {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 13px;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .qty-btn:hover {
      background: rgba(108, 99, 255, 0.2);
      border-color: var(--accent);
    }

    .qty-btn.remove:hover {
      background: rgba(248, 113, 113, 0.2);
      border-color: var(--danger);
    }

    .qty-num {
      font-size: 13px;
      font-weight: 900;
      width: 18px;
      text-align: center;
    }

    .deck-footer {
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.3);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    .btn-save {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      background: linear-gradient(135deg, var(--success), #059669);
      color: #fff;
      box-shadow: 0 4px 16px rgba(52, 211, 153, 0.3);
      transition: all 0.2s;
    }

    .btn-save:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(52, 211, 153, 0.4);
    }

    .btn-save:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-cancel {
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .btn-delete {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      background: linear-gradient(135deg, var(--danger), #dc2626);
      color: #fff;
      box-shadow: 0 4px 16px rgba(248, 113, 113, 0.3);
      transition: all 0.2s;
    }

    .btn-delete:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(248, 113, 113, 0.4);
    }

    .btn-delete:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .deck-empty {
      text-align: center;
      color: var(--text-dim);
      padding: 30px 20px;
      font-size: 12px;
      line-height: 2;
    }

    .deck-empty .icon {
      font-size: 36px;
      margin-bottom: 6px;
    }

    .toast {
      position: fixed;
      top: 80px;
      right: 24px;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      z-index: 999;
      animation: toastIn 0.3s ease-out;
      backdrop-filter: blur(20px);
    }

    .toast.success {
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: var(--success);
    }

    .toast.error {
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: var(--danger);
    }

    @keyframes toastIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    /* Confirm modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: #141828;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      max-width: 380px;
      width: 90%;
      text-align: center;
    }

    .modal-box h3 {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .modal-box p {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .modal-actions .btn-ok {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff;
    }

    .modal-actions .btn-no {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    .modal-actions button:hover {
      transform: translateY(-1px);
    }

    /* ============================================ */
    /* Smartphone Landscape (iPhone 16: max-height: 480px) */
    /* ============================================ */
    @media (max-height: 480px) {
      .header {
        padding: 8px 16px;
      }

      .header h1 {
        font-size: 16px;
      }

      .header a {
        padding: 4px 10px;
        font-size: 11px;
      }

      .page-content {
        height: calc(100vh - 50px);
      }

      /* デッキ一覧をコンパクトに */
      .saved-header {
        padding: 4px 12px 2px;
        font-size: 10px;
      }

      .saved-scroll {
        padding: 4px 12px 6px;
        min-height: 54px;
        gap: 8px;
      }

      .saved-deck-card {
        width: 90px;
        border-radius: 6px;
      }

      .saved-deck-card img,
      .saved-deck-card .noimg {
        height: 28px;
        font-size: 14px;
      }

      .saved-deck-info {
        padding: 2px 4px;
      }

      .saved-deck-name {
        font-size: 8px;
      }

      .saved-deck-meta {
        font-size: 7px;
      }

      /* ビルダーエリアを左右に綺麗に分割 */
      .builder {
        grid-template-columns: 1fr 1.1fr !important;
        grid-template-rows: none !important;
        overflow: hidden;
      }

      .pool-panel {
        border-right: 1px solid var(--border);
      }

      .pool-header {
        padding: 6px 12px;
      }

      .pool-header h2 {
        font-size: 11px;
        margin-bottom: 4px;
      }

      .search-box input {
        padding: 5px 10px 5px 28px;
        font-size: 11px;
        border-radius: 6px;
      }

      .search-box::before {
        left: 8px;
        font-size: 11px;
      }

      .pool-body {
        padding: 6px 12px;
      }

      .pool-grid {
        grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
        gap: 6px;
      }

      .pool-card {
        border-radius: 6px;
        font-size: 8px;
      }

      .pool-card-img,
      .pool-card-noimg {
        height: 50px;
        font-size: 18px;
      }

      .pool-card-body {
        padding: 3px 5px;
      }

      .pool-card-name {
        font-size: 8px;
        margin-bottom: 2px;
      }

      .pool-card-stats {
        font-size: 7px;
      }

      .pool-card-stats .cost {
        padding: 0 4px;
      }

      .deck-panel {
        max-height: 100%;
      }

      .deck-header {
        padding: 6px 12px;
      }

      .deck-header h2 {
        font-size: 11px;
        margin-bottom: 4px;
      }

      .deck-name-row input {
        padding: 6px 10px;
        font-size: 11px;
        border-radius: 6px;
      }

      .deck-header div[style*="margin-top:10px"] {
        margin-top: 4px !important;
        padding: 6px !important;
        border-radius: 6px;
      }

      .deck-header span[style*="font-size:10px"] {
        font-size: 8px !important;
        margin-bottom: 3px !important;
      }

      .deck-header label {
        font-size: 9px !important;
        gap: 4px !important;
      }

      #custom-sleeve-area {
        margin-top: 4px !important;
        padding-top: 4px !important;
      }

      #sleeve-preview-container {
        width: 24px !important;
        height: 34px !important;
      }

      #sleeve-file-name {
        font-size: 8px !important;
        max-width: 140px !important;
      }

      .deck-count-bar {
        padding: 4px 12px;
      }

      .deck-count {
        font-size: 11px;
      }

      .deck-count-hint {
        font-size: 9px;
      }

      .deck-body {
        padding: 6px 12px;
      }

      .deck-entry {
        padding: 4px 6px;
        gap: 6px;
        margin-bottom: 2px;
        border-radius: 5px;
      }

      .deck-entry-img,
      .deck-entry-noimg {
        width: 24px;
        height: 24px;
        font-size: 11px;
      }

      .deck-entry-name {
        font-size: 9px;
      }

      .deck-entry-meta {
        font-size: 8px;
      }

      .qty-btn {
        width: 18px;
        height: 18px;
        font-size: 11px;
        border-radius: 4px;
      }

      .qty-num {
        font-size: 11px;
        width: 14px;
      }

      .deck-footer {
        padding: 6px 12px;
      }

      .btn-save,
      .btn-cancel,
      .btn-delete {
        padding: 8px;
        font-size: 12px;
        border-radius: 6px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>📦 デッキ作成</h1>
    <div class="header-actions">
      <a href="/">🏠 ロビーに戻る</a>
    </div>
  </div>

  <div class="page-content">
    <!-- Saved decks: Mine -->
    <div class="saved-section">
      <div class="saved-header">📋 自分のデッキ</div>
      <div class="saved-scroll" id="my-decks-scroll">
        <div class="empty-decks">読み込み中...</div>
      </div>
    </div>

    <!-- Saved decks: Others -->
    <div class="saved-section">
      <div class="saved-header">🌐 他のプレイヤーのデッキ</div>
      <div class="saved-scroll" id="other-decks-scroll">
        <div class="empty-decks">読み込み中...</div>
      </div>
    </div>

    <!-- Builder -->
    <div class="builder">
      <div class="pool-panel">
        <div class="pool-header">
          <h2>🃏 カード一覧 <span id="pool-count" style="color:var(--text-dim);font-size:12px;"></span></h2>
          <div class="search-box">
            <input type="text" id="search-input" placeholder="カード名で検索..." oninput="filterCards()">
          </div>
        </div>
        <div class="pool-body">
          <div class="pool-grid" id="pool-grid">
            <div class="empty-msg">読み込み中...</div>
          </div>
        </div>
      </div>

      <div class="deck-panel">
        <div class="deck-header">
          <h2 id="deck-title">📋 デッキ内容</h2>
          <div class="deck-name-row">
            <input type="text" id="deck-name" placeholder="デッキ名を入力..." maxlength="50">
          </div>
          <!-- スリーブ設定パネル -->
          <div
            style="margin-top:10px; padding:10px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:8px;">
            <span style="font-size:10px; font-weight:700; color:var(--accent); display:block; margin-bottom:6px;">🛡️
              デッキ裏面（スリーブ）の設定</span>
            <div style="display:flex; gap:16px; margin-bottom:8px; font-size:12px;">
              <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                <input type="radio" name="sleeve-type" value="normal" checked onchange="toggleSleeveUI()">
                通常裏面
              </label>
              <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                <input type="radio" name="sleeve-type" value="custom" onchange="toggleSleeveUI()">
                スリーブ（カスタム画像）
              </label>
            </div>
            <!-- カスタムスリーブ画像選択 -->
            <div id="custom-sleeve-area"
              style="display:none; flex-direction:column; gap:6px; margin-top:6px; border-top:1px dashed var(--border); padding-top:6px;">
              <input type="file" id="sleeve-file-input" accept="image/*" onchange="previewSleeve(event)"
                style="font-size:10px; color:var(--text-dim); outline:none;">
              <div style="display:flex; gap:10px; align-items:center;">
                <div id="sleeve-preview-container"
                  style="width:36px; height:50px; border:1px solid var(--border); border-radius:4px; overflow:hidden; background:rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                  <span style="font-size:16px; color:var(--text-dim);">🂠</span>
                </div>
                <span
                  style="font-size:9px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px;"
                  id="sleeve-file-name">画像を選択してください</span>
              </div>
            </div>
          </div>
        </div>
        <div class="deck-count-bar">
          <div class="deck-count invalid" id="deck-count">0 枚</div>
          <div class="deck-count-hint">40枚以上で保存可能</div>
        </div>
        <div class="deck-body" id="deck-body">
          <div class="deck-empty">
            <div class="icon">📦</div>左のカード一覧からクリックで<br>カードを追加してください
          </div>
        </div>
        <div class="deck-footer">
          <button class="btn-cancel" id="btn-cancel" style="display:none;" onclick="cancelEdit()">✕</button>
          <button class="btn-save" id="btn-save" onclick="saveDeck()" disabled>📦 デッキを保存する</button>
          <button class="btn-delete" id="btn-delete" style="display:none;" onclick="confirmDeleteDeck()">🗑️
            デッキを削除する</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-container"></div>

  <script>
    const API = location.origin;
    const authToken = localStorage.getItem('auth_token') || '';
    const playerName = localStorage.getItem('player_name') || '';

    let allCards = [];
    let deck = {};
    let editingDeckId = null;

    // ============================================================
    // Cards
    // ============================================================
    async function loadCards() {
      try {
        const res = await fetch(`${API}/api/cards`);
        allCards = await res.json();
        document.getElementById('pool-count').textContent = `(${allCards.length}枚)`;
        renderPool(allCards);
      } catch (err) {
        document.getElementById('pool-grid').innerHTML = '<div class="empty-msg">サーバーに接続できません</div>';
      }
    }

    function filterCards() {
      const q = document.getElementById('search-input').value.trim().toLowerCase();
      renderPool(q ? allCards.filter(c => c.name.toLowerCase().includes(q)) : allCards);
    }

    function getFirstCardImage(cardIds) {
      if (!cardIds || !cardIds.length) return null;
      const card = allCards.find(c => c.id === cardIds[0]);
      return card && card.image ? `/static/cards/${card.image}` : null;
    }

    const typeIcons = { creature: '⚔', tamaseed: '🔮', tamaseed_creature: '🔮⚔', spell: '📜', cross_gear: '⚙', castle: '🏰', field: '🌍', dragheart: '🐉', aura: '✨', twinpact: '🔄' };

    function renderPool(cards) {
      const grid = document.getElementById('pool-grid');
      if (!cards.length) { grid.innerHTML = '<div class="empty-msg">カードが見つかりません</div>'; return; }
      grid.innerHTML = cards.map(card => {
        const civ = (card.civilization || 'fire').split(',')[0];
        const ti = typeIcons[card.card_type] || '🃏';
        const img = card.image
          ? `<img class="pool-card-img" src="/static/cards/${card.image}" alt="${card.name}">`
          : `<div class="pool-card-noimg">${ti}</div>`;
        return `<div class="pool-card civ-${civ}" onclick="addToDeck(${card.id})" title="${card.name}">
          ${img}<div class="pool-card-body"><div class="pool-card-name">${card.name}</div>
          <div class="pool-card-stats"><span class="cost">${card.cost}</span><span class="power">${card.power || ti}</span></div></div></div>`;
      }).join('');
    }

    // ============================================================
    // Deck operations
    // ============================================================
    function addToDeck(id) { deck[id] = (deck[id] || 0) + 1; renderDeck(); }
    function removeFromDeck(id) { if (deck[id]) { deck[id]--; if (deck[id] <= 0) delete deck[id]; } renderDeck(); }
    function getDeckTotal() { return Object.values(deck).reduce((s, q) => s + q, 0); }

    function renderDeck() {
      const body = document.getElementById('deck-body');
      const total = getDeckTotal();
      const countEl = document.getElementById('deck-count');
      countEl.textContent = `${total} 枚`;
      countEl.className = `deck-count ${total >= 40 ? 'valid' : 'invalid'}`;
      document.getElementById('btn-save').disabled = total < 40;

      const entries = Object.entries(deck);
      if (!entries.length) {
        body.innerHTML = '<div class="deck-empty"><div class="icon">📦</div>左のカード一覧からクリックで<br>カードを追加してください</div>';
        return;
      }

      const sorted = entries.sort((a, b) => {
        const ca = allCards.find(c => c.id === +a[0]), cb = allCards.find(c => c.id === +b[0]);
        return (ca && cb) ? ca.name.localeCompare(cb.name, 'ja') : 0;
      });

      body.innerHTML = sorted.map(([cid, qty]) => {
        const card = allCards.find(c => c.id === +cid);
        if (!card) return '';
        const ti = typeIcons[card.card_type] || '🃏';
        const img = card.image
          ? `<img class="deck-entry-img" src="/static/cards/${card.image}" alt="${card.name}">`
          : `<div class="deck-entry-noimg">${ti}</div>`;
        return `<div class="deck-entry">${img}
          <div class="deck-entry-info"><div class="deck-entry-name">${card.name}</div>
          <div class="deck-entry-meta">コスト${card.cost}${card.power ? ' / P' + card.power : ''}</div></div>
          <div class="deck-entry-qty"><button class="qty-btn remove" onclick="removeFromDeck(${card.id})">−</button>
          <span class="qty-num">${qty}</span><button class="qty-btn" onclick="addToDeck(${card.id})">+</button></div></div>`;
      }).join('');
    }

    // ============================================================
    // Sleeve operations
    // ============================================================
    let selectedSleeveFile = null;
    let savedSleeveImage = null; // 既存デッキのスリーブファイル名

    function toggleSleeveUI() {
      const type = document.querySelector('input[name="sleeve-type"]:checked').value;
      const area = document.getElementById('custom-sleeve-area');
      area.style.display = type === 'custom' ? 'flex' : 'none';
    }

    function previewSleeve(e) {
      const file = e.target.files[0];
      if (!file) return;
      selectedSleeveFile = file;
      document.getElementById('sleeve-file-name').textContent = file.name;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const container = document.getElementById('sleeve-preview-container');
        container.innerHTML = `<img src="${evt.target.result}" style="width:100%; height:100%; object-fit:cover;" />`;
      };
      reader.readAsDataURL(file);
    }

    // ============================================================
    // Save / Update deck
    // ============================================================
    async function saveDeck() {
      const deckName = document.getElementById('deck-name').value.trim();
      if (!deckName) { showToast('デッキ名を入力してください', 'error'); return; }
      if (getDeckTotal() < 40) { showToast('40枚以上必要です', 'error'); return; }

      const cardIds = [];
      for (const [cid, qty] of Object.entries(deck)) for (let i = 0; i < qty; i++) cardIds.push(+cid);

      const btn = document.getElementById('btn-save');
      btn.innerHTML = '<span class="spinner"></span>保存中...';
      btn.disabled = true;

      const isEdit = editingDeckId !== null;
      const url = isEdit ? `${API}/update_deck` : `${API}/save_deck`;

      const sleeveType = document.querySelector('input[name="sleeve-type"]:checked').value;
      let finalSleeveImage = null;

      if (sleeveType === 'custom') {
        if (selectedSleeveFile) {
          // 画像をアップロード
          const formData = new FormData();
          formData.append('image', selectedSleeveFile);
          try {
            const uploadRes = await fetch(`${API}/api/upload_sleeve`, {
              method: 'POST',
              body: formData
            });
            const uploadData = await uploadRes.json();
            if (uploadData.success) {
              finalSleeveImage = uploadData.sleeve_image;
            } else {
              showToast(uploadData.error || 'スリーブ画像のアップロードに失敗しました', 'error');
              btn.innerHTML = isEdit ? '✅ デッキを更新する' : '📦 デッキを保存する';
              btn.disabled = getDeckTotal() < 40;
              return;
            }
          } catch (e) {
            showToast('スリーブ画像のアップロード中に通信エラーが発生しました', 'error');
            btn.innerHTML = isEdit ? '✅ デッキを更新する' : '📦 デッキを保存する';
            btn.disabled = getDeckTotal() < 40;
            return;
          }
        } else {
          // 新ファイル無し：既存のものを保持
          finalSleeveImage = savedSleeveImage;
        }
      }

      const payload = isEdit
        ? { deck_id: editingDeckId, name: deckName, cards: cardIds, token: authToken, sleeve_type: sleeveType, sleeve_image: finalSleeveImage }
        : { name: deckName, cards: cardIds, token: authToken, sleeve_type: sleeveType, sleeve_image: finalSleeveImage };

      try {
        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const data = await res.json();
        if (data.success) {
          showToast(`「${data.deck.name}」を${isEdit ? '更新' : '保存'}しました！`, 'success');
          cancelEdit();
          loadSavedDecks();
        } else {
          showToast(data.error || 'エラーが発生しました', 'error');
        }
      } catch (err) { showToast('サーバーに接続できません', 'error'); }
      finally { btn.innerHTML = isEdit ? '✅ デッキを更新する' : '📦 デッキを保存する'; btn.disabled = getDeckTotal() < 40; }
    }

    // ============================================================
    // Edit own deck
    // ============================================================
    function loadDeckForEdit(deckData) {
      editingDeckId = deckData.id;
      document.getElementById('deck-name').value = deckData.name;
      document.getElementById('deck-title').textContent = `✏️ デッキ編集 (ID:${deckData.id})`;
      document.getElementById('btn-save').textContent = '✅ デッキを更新する';
      document.getElementById('btn-cancel').style.display = '';
      document.getElementById('btn-delete').style.display = '';

      // スリーブ設定の読み込み
      const sleeveType = deckData.sleeve_type || 'normal';
      savedSleeveImage = deckData.sleeve_image || null;
      selectedSleeveFile = null;

      document.querySelector(`input[name="sleeve-type"][value="${sleeveType}"]`).checked = true;
      document.getElementById('sleeve-file-input').value = '';

      const preview = document.getElementById('sleeve-preview-container');
      if (sleeveType === 'custom' && savedSleeveImage) {
        preview.innerHTML = `<img src="/static/sleeves/${savedSleeveImage}" style="width:100%; height:100%; object-fit:cover;" />`;
        document.getElementById('sleeve-file-name').textContent = savedSleeveImage;
      } else {
        preview.innerHTML = `<span style="font-size:16px; color:var(--text-dim);">🂠</span>`;
        document.getElementById('sleeve-file-name').textContent = '画像を選択してください';
      }
      toggleSleeveUI();

      deck = {};
      for (const cid of deckData.cards) deck[cid] = (deck[cid] || 0) + 1;
      renderDeck();
    }

    function cancelEdit() {
      editingDeckId = null;
      deck = {};
      document.getElementById('deck-name').value = '';
      document.getElementById('deck-title').textContent = '📋 デッキ内容';
      document.getElementById('btn-save').textContent = '📦 デッキを保存する';
      document.getElementById('btn-cancel').style.display = 'none';
      document.getElementById('btn-delete').style.display = 'none';

      // スリーブ設定のリセット
      savedSleeveImage = null;
      selectedSleeveFile = null;
      document.querySelector('input[name="sleeve-type"][value="normal"]').checked = true;
      document.getElementById('sleeve-file-input').value = '';
      document.getElementById('sleeve-preview-container').innerHTML = `<span style="font-size:16px; color:var(--text-dim);">🂠</span>`;
      document.getElementById('sleeve-file-name').textContent = '画像を選択してください';
      toggleSleeveUI();

      renderDeck();
    }

    // ============================================================
    // Delete deck
    // ============================================================
    function confirmDeleteDeck() {
      if (editingDeckId === null) return;

      const deckName = document.getElementById('deck-name').value.trim() || '無題のデッキ';
      document.getElementById('modal-container').innerHTML = `
        <div class="modal-overlay" onclick="closeModal()">
          <div class="modal-box" onclick="event.stopPropagation()">
            <h3>🗑️ デッキの削除</h3>
            <p>本当にデッキ「${deckName}」を削除しますか？<br><span style="color:var(--danger); font-weight:bold;">この操作は取り消せません。</span></p>
            <div class="modal-actions">
              <button class="btn-no" onclick="closeModal()">キャンセル</button>
              <button class="btn-ok" onclick="deleteDeck()" style="background:linear-gradient(135deg,var(--danger),#dc2626); box-shadow:0 4px 16px rgba(248,113,113,0.3);">削除する</button>
            </div>
          </div>
        </div>`;
    }

    async function deleteDeck() {
      if (editingDeckId === null) return;
      closeModal();

      const btn = document.getElementById('btn-delete');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span>削除中...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/delete_deck`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: authToken, deck_id: editingDeckId })
        });
        const data = await res.json();
        if (data.success) {
          showToast('デッキを削除しました。', 'success');
          cancelEdit();
          loadSavedDecks();
        } else {
          showToast(data.error || 'エラーが発生しました', 'error');
        }
      } catch (err) {
        showToast('サーバーに接続できません', 'error');
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    // ============================================================
    // Copy & View other's deck
    // ============================================================
    function showOtherDeckDetails(deckData) {
      const cardsHtml = deckData.cards.map(cardId => {
        const card = allCards.find(c => c.id === cardId);
        if (!card) return '';
        const civ = (card.civilization || 'fire').split(',')[0];
        const ti = typeIcons[card.card_type] || '🃏';
        const img = card.image
          ? `<img src="/static/cards/${card.image}" style="width:100%; aspect-ratio:7/10; object-fit:cover; border-radius:6px; display:block;" alt="${card.name}">`
          : `<div style="width:100%; aspect-ratio:7/10; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.3); border-radius:6px; font-size:18px;">${ti}</div>`;
        return `<div class="detail-card civ-${civ}" title="${card.name}" style="width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:8px; overflow:hidden; padding:4px; display:flex; flex-direction:column; gap:4px; align-items:center; justify-content:space-between; box-sizing:border-box;">
          ${img}
          <div style="font-size:9px; text-align:center; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; font-weight:bold;">
            ${card.name}
          </div>
        </div>`;
      }).join('');

      document.getElementById('modal-container').innerHTML = `
        <div class="modal-overlay" onclick="closeModal()" style="position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:999; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px);">
          <div class="deck-detail-modal-box" onclick="event.stopPropagation()" style="background:var(--bg-primary); border:1.5px solid var(--accent); border-radius:20px; padding:28px; max-width:880px; width:95%; max-height:85vh; display:flex; flex-direction:column; box-shadow:0 20px 50px rgba(0,0,0,0.7); animation:fadeIn 0.3s ease-out; box-sizing:border-box;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:14px; width:100%;">
              <h3 style="margin:0; font-size:18px; color:var(--accent); font-weight:900; letter-spacing:0.5px;">🌐 ${deckData.owner} さんのデッキ: ${deckData.name}</h3>
              <button onclick="closeModal()" style="background:transparent; border:none; color:var(--text-dim); font-size:22px; cursor:pointer; transition:color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-dim)'">✕</button>
            </div>

            <div style="overflow-y:auto; flex:1; margin-bottom:24px; padding-right:8px; width:100%; box-sizing:border-box;" class="detail-scroll">
              <div style="display:grid; grid-template-columns:repeat(8, 1fr); gap:10px; width:100%; box-sizing:border-box;">
                ${cardsHtml}
              </div>
            </div>

            <div style="display:flex; justify-content:center; border-top:1px solid var(--border); padding-top:20px; width:100%;">
              <button class="btn-save" onclick='copyToEditor(${JSON.stringify(deckData)})' style="padding:14px 28px; font-size:14px; background:linear-gradient(135deg, var(--accent), #8b5cf6); color:#fff; border:none; border-radius:10px; cursor:pointer; font-weight:900; box-shadow:0 6px 20px var(--accent-glow); transition:all 0.2s;" onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 8px 25px var(--accent-glow)';" onmouseout="this.style.transform='none';this.style.boxShadow='0 6px 20px var(--accent-glow)';">
                📥 自身のデッキ作成画面にカードをコピーする
              </button>
            </div>
          </div>
        </div>`;
    }

    function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

    function copyToEditor(deckData) {
      closeModal();

      // deck 状態をクリアして、新しいカード群をセット
      deck = {};
      deckData.cards.forEach(cardId => {
        deck[cardId] = (deck[cardId] || 0) + 1;
      });

      // デッキ名のプレフィル
      const nameInput = document.getElementById('deck-name');
      if (nameInput) {
        nameInput.value = deckData.name + " (コピー)";
      }

      // 新規デッキとして扱わせるため編集IDをクリア
      editingDeckId = null;

      // UIの再描画
      renderDeck();

      showToast(`「${deckData.name}」のカードをデッキ作成画面にコピーしました！`, 'success');
    }

    // ============================================================
    // Load & render saved decks
    // ============================================================
    async function loadSavedDecks() {
      const hdrs = { 'Content-Type': 'application/json' };
      const body = JSON.stringify({ token: authToken });

      try {
        const [myRes, otherRes] = await Promise.all([
          fetch(`${API}/api/my_decks`, { method: 'POST', headers: hdrs, body }),
          fetch(`${API}/api/other_decks`, { method: 'POST', headers: hdrs, body }),
        ]);
        const myDecks = await myRes.json();
        const otherDecks = await otherRes.json();

        renderMyDecks(Array.isArray(myDecks) ? myDecks : []);
        renderOtherDecks(Array.isArray(otherDecks) ? otherDecks : []);
      } catch (e) { console.error(e); }
    }

    function renderMyDecks(decks) {
      const el = document.getElementById('my-decks-scroll');
      if (!decks.length) { el.innerHTML = '<div class="empty-decks">まだデッキがありません</div>'; return; }
      el.innerHTML = decks.map((d, i) => {
        const imgSrc = getFirstCardImage(d.cards);
        const imgHtml = imgSrc ? `<img src="${imgSrc}" alt="">` : `<div class="noimg">📦</div>`;
        return `<div class="saved-deck-card own" onclick='loadDeckForEdit(${JSON.stringify(d)})' title="クリックで編集">
          ${imgHtml}<div class="saved-deck-info"><div class="saved-deck-name">${d.name}</div>
          <div class="saved-deck-meta">${d.card_count}枚</div></div></div>`;
      }).join('');
    }

    function renderOtherDecks(decks) {
      const el = document.getElementById('other-decks-scroll');
      if (!decks.length) { el.innerHTML = '<div class="empty-decks">他のプレイヤーのデッキはありません</div>'; return; }
      el.innerHTML = decks.map(d => {
        const imgSrc = getFirstCardImage(d.cards);
        const imgHtml = imgSrc ? `<img src="${imgSrc}" alt="">` : `<div class="noimg">📦</div>`;
        return `<div class="saved-deck-card other" onclick='showOtherDeckDetails(${JSON.stringify(d)})' title="${d.owner} さんのデッキ - クリックしてカードを表示">
          ${imgHtml}<div class="saved-deck-info"><div class="saved-deck-name">${d.name}</div>
          <div class="saved-deck-meta">${d.owner} · ${d.card_count}枚</div></div></div>`;
      }).join('');
    }

    // ============================================================
    // Toast
    // ============================================================
    function showToast(msg, type) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 4000);
    }

    // Init
    loadCards().then(() => loadSavedDecks());
  </script>
</body>

</html>
